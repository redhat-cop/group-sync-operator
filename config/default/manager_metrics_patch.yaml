# This patch configures the manager container to serve metrics securely
# using controller-runtime's built-in TLS and authentication/authorization support.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-addr=:8443"
            - "--leader-elect"
          ports:
            - containerPort: 8443
              name: metrics
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/certs/tls
              name: tls-cert
              readOnly: true
      volumes:
        - name: tls-cert
          secret:
            defaultMode: 420
            secretName: group-sync-operator-certs
