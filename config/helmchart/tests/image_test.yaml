suite: Image registry and repository tests
templates:
  - manager.yaml
tests:
  - it: uses default repository and appVersion tag
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/redhat-cop/group-sync-operator:0.0.1

  - it: allows overriding the image tag
    set:
      image.tag: latest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/redhat-cop/group-sync-operator:latest

  - it: falls back to the deprecated image.version when tag is not set
    set:
      image.tag: null
      image.version: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/redhat-cop/group-sync-operator:v1.2.3

  - it: falls back to the chart appVersion when neither tag nor version is set
    set:
      image.tag: null
      image.version: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/redhat-cop/group-sync-operator:0.0.1

  - it: composes image from registry and repository
    set:
      image.registry: quay.io
      image.repository: redhat-cop/group-sync-operator
      image.tag: 1.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/redhat-cop/group-sync-operator:1.0.0

  - it: supports sha256 digest image references
    set:
      image.tag: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/redhat-cop/group-sync-operator@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: global imageRegistry overrides per-image registry
    set:
      global.imageRegistry: registry.example.com
      image.registry: quay.io
      image.repository: redhat-cop/group-sync-operator
      image.tag: 2.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/redhat-cop/group-sync-operator:2.0.0

  - it: global imageRegistry prepends to repository when no per-image registry
    set:
      global.imageRegistry: registry.example.com
      image.repository: group-sync-operator
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/group-sync-operator:0.0.1

  - it: supports templated registry value
    set:
      global.containerImageRegistry: registry.example.com
      image.registry: "{{ .Values.global.containerImageRegistry }}"
      image.repository: redhat-cop/group-sync-operator
      image.tag: 1.0.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/redhat-cop/group-sync-operator:1.0.1

  - it: supports templated global imageRegistry
    set:
      global.containerImageRegistry: registry.example.com
      global.imageRegistry: "{{ .Values.global.containerImageRegistry }}"
      image.repository: group-sync-operator
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/group-sync-operator:0.0.1
