apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "group-sync-operator.fullname" . }}
  labels:
    {{- include "group-sync-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "group-sync-operator.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "group-sync-operator.selectorLabels" . | nindent 8 }}
        control-plane: group-sync-operator
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "group-sync-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - command:
          - /manager
          args:
          - --health-probe-bind-address=:8081
          - --metrics-addr=:8443
          - --leader-elect
          image: "{{ template "group-sync-operator.image" .Values.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: {{ .Chart.Name }}
          ports:
          - containerPort: 8443
            name: metrics
            protocol: TCP
          env:
            {{- with .Values.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
          - mountPath: /etc/certs/tls
            name: tls-cert
            readOnly: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tls-cert
          secret:
            defaultMode: 420
            secretName: group-sync-operator-certs
