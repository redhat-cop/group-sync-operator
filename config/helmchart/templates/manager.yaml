apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "group-sync-operator.fullname" . }}
  labels:
    {{- include "group-sync-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "group-sync-operator.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "group-sync-operator.selectorLabels" . | nindent 8 }}
        control-plane: group-sync-operator
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "group-sync-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - command:
          - /manager
          args:
          - --health-probe-bind-address=:8081
          {{- if .Values.enableMonitoring }}
          - --metrics-addr=:8443
          - --metrics-secure={{ .Values.metricsSecure }}
          {{- end }}
          - --leader-elect
          {{- with .Values.args }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
          image: {{ include "group-sync-operator.image" ( dict "imageRoot" .Values.image "global" .Values.global "Chart" .Chart "context" $ ) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: {{ .Chart.Name }}
          {{- if .Values.enableMonitoring }}
          ports:
          - containerPort: 8443
            name: metrics
            protocol: TCP
          {{- end }}
          env:
          {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if or .Values.enableMonitoring .Values.volumeMounts }}
          volumeMounts:
          {{- end }}
          {{- if .Values.enableMonitoring }}
          - mountPath: /etc/certs/tls
            name: tls-cert
            readOnly: true
          {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.enableMonitoring .Values.volumes }}
      volumes:
      {{- end }}
      {{- if .Values.enableMonitoring }}
        - name: tls-cert
          secret:
            defaultMode: 420
            secretName: group-sync-operator-certs
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
